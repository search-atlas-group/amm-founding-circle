name: onboarding-windows
on: [push, pull_request]
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pytest onboarding/test_onboarding.py onboarding/test_clayton_portability.py -q
      - shell: pwsh
        run: .\onboarding\onboard.ps1 -NoOpen -NoHermes -AnswersFile .\answers.json -Answer 9.proven=false
