name: onboarding-windows
on: [push, pull_request]
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pytest onboarding/test_onboarding.py onboarding/test_clayton_portability.py -q
      - shell: pwsh
        run: |
          Set-Content -Path .\answers.json -Value '{"9.proven": false}'
          .\onboarding\onboard.ps1 -NoOpen -NoHermes -AnswersFile .\answers.json -Answer 3.atlas=false
